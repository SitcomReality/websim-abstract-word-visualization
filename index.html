<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abstract Word Visualization</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/words.css">
    <link rel="stylesheet" href="css/effects.css">
    <link rel="stylesheet" href="css/screens.css">
    <script type="importmap">
    {
        "imports": {
            "config/": "./js/config/",
            "core/": "./js/core/",
            "components/": "./js/components/",
            "effects/": "./js/effects/",
            "screens/": "./js/screens/",
            "utils/": "./js/utils/"
        }
    }
    </script>
    <script type="module" src="js/main.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #121212;
            font-family: 'Arial', sans-serif;
            color: #f0f0f0;
            user-select: none;
        }
        
        .container {
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        .word {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease-out, opacity 0.3s;
            transform-origin: center;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        .word span {
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }
        
        .screen {
            display: none;
        }
        
        .screen.active {
            display: block;
        }
        
        .trail {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: fadeOut 1s forwards;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: scale(0.3);
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="splash-screen" class="screen active">
            <div class="splash-content">
                <h1>Abstract Word Visualization</h1>
                <button id="start-button">Enter Experience</button>
            </div>
        </div>
        
        <div id="game-screen" class="screen">
            <div class="container">
                <div id="smorma" class="word"><span>Smorma pips</span></div>
                <div id="pips" class="word"><span>Pips</span></div>
                <div id="tine" class="word"><span>Tine</span></div>
                <div id="elusive" class="word"><span>Elusive allusion</span></div>
                <div id="paradiastolic" class="word"><span>Paradiastolic clotting</span></div>
                <div id="perihelion" class="word"><span>Perihelion torsion</span></div>
                <div id="scolflocs" class="word"><span>Scolflocs periporter</span></div>
                <div id="hyperbolic" class="word"><span>Hyperbolic lenity</span></div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const words = document.querySelectorAll('.word');
            const container = document.querySelector('.container');
            const startButton = document.getElementById('start-button');
            const splashScreen = document.getElementById('splash-screen');
            const gameScreen = document.getElementById('game-screen');
            
            startButton.addEventListener('click', () => {
                splashScreen.classList.remove('active');
                gameScreen.classList.add('active');
            });
            
            // Initialize positions
            words.forEach(word => {
                positionRandomly(word);
                
                // Add floating animation
                setInterval(() => {
                    if (!word.classList.contains('active')) {
                        word.style.transform = `translate(${Math.sin(Date.now() * 0.001 + parseInt(word.id.charCodeAt(0))) * 10}px, 
                                               ${Math.cos(Date.now() * 0.001 + parseInt(word.id.charCodeAt(0))) * 10}px) 
                                               rotate(${Math.sin(Date.now() * 0.0005) * 5}deg)`;
                    }
                }, 50);
                
                // Click events
                word.addEventListener('click', () => {
                    words.forEach(w => w.classList.remove('active'));
                    word.classList.add('active');
                    
                    // Create special effect based on word
                    createSpecialEffect(word);
                    
                    // Reset after 3 seconds
                    setTimeout(() => {
                        word.classList.remove('active');
                    }, 3000);
                });
                
                // Drag functionality
                let isDragging = false;
                let offsetX, offsetY;
                
                word.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    offsetX = e.clientX - word.getBoundingClientRect().left;
                    offsetY = e.clientY - word.getBoundingClientRect().top;
                    word.style.transition = 'none';
                });
                
                document.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const x = e.clientX - offsetX;
                        const y = e.clientY - offsetY;
                        word.style.left = `${x}px`;
                        word.style.top = `${y}px`;
                        
                        // Create trail
                        createTrail(e.clientX, e.clientY, word);
                    }
                });
                
                document.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        word.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
                    }
                });
            });
            
            // Position elements randomly on the screen
            function positionRandomly(element) {
                const rect = element.getBoundingClientRect();
                const maxX = window.innerWidth - rect.width;
                const maxY = window.innerHeight - rect.height;
                const x = Math.random() * maxX;
                const y = Math.random() * maxY;
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
            }
            
            function createTrail(x, y, word) {
                const trail = document.createElement('div');
                trail.classList.add('trail');
                trail.style.left = `${x}px`;
                trail.style.top = `${y}px`;
                trail.style.width = '10px';
                trail.style.height = '10px';
                trail.style.background = window.getComputedStyle(word).background;
                container.appendChild(trail);
                
                // Remove trail element after animation
                setTimeout(() => {
                    container.removeChild(trail);
                }, 1000);
            }
            
            function createSpecialEffect(word) {
                const id = word.id;
                const rect = word.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                switch(id) {
                    case 'smorma':
                        createExplosion(centerX, centerY, '#ff5722', 20);
                        break;
                    case 'pips':
                        createSpiral(centerX, centerY, '#9c27b0', 15);
                        break;
                    case 'tine':
                        createWave(centerX, centerY, '#2196f3', 10);
                        break;
                    case 'elusive':
                        createFadeEffect(centerX, centerY, '#009688', 25);
                        break;
                    case 'paradiastolic':
                        createPulse(centerX, centerY, '#ffc107', 20);
                        break;
                    case 'perihelion':
                        createOrbit(centerX, centerY, '#f44336', 8);
                        break;
                    case 'scolflocs':
                        createRain(centerX, centerY, '#3f51b5', 30);
                        break;
                    case 'hyperbolic':
                        createHyperEffect(centerX, centerY, '#607d8b', 15);
                        break;
                    default:
                        createExplosion(centerX, centerY, '#ffffff', 10);
                }
            }
            
            function createExplosion(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('trail');
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.width = '5px';
                    particle.style.height = '5px';
                    particle.style.background = color;
                    
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 2 + Math.random() * 5;
                    const distance = 100 + Math.random() * 150;
                    
                    particle.style.animation = 'none';
                    container.appendChild(particle);
                    
                    const startTime = Date.now();
                    const duration = 1000 + Math.random() * 1000;
                    
                    function animateParticle() {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        const currentDistance = distance * progress;
                        const opacity = 1 - progress;
                        
                        particle.style.left = `${x + Math.cos(angle) * currentDistance}px`;
                        particle.style.top = `${y + Math.sin(angle) * currentDistance}px`;
                        particle.style.opacity = opacity;
                        
                        if (progress < 1) {
                            requestAnimationFrame(animateParticle);
                        } else {
                            container.removeChild(particle);
                        }
                    }
                    
                    requestAnimationFrame(animateParticle);
                }
            }
            
            function createSpiral(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('trail');
                    particle.style.left = `${x}px`;
                    particle.style.top = `${y}px`;
                    particle.style.width = '8px';
                    particle.style.height = '8px';
                    particle.style.background = color;
                    particle.style.borderRadius = '50%';
                    
                    container.appendChild(particle);
                    
                    const startTime = Date.now();
                    const duration = 2000;
                    const delay = i * 100;
                    
                    function animateParticle() {
                        const now = Date.now();
                        if (now < startTime + delay) {
                            requestAnimationFrame(animateParticle);
                            return;
                        }
                        
                        const elapsed = now - (startTime + delay);
                        const progress = Math.min(elapsed / duration, 1);
                        
                        const angle = progress * Math.PI * 10 + (i * Math.PI / count * 2);
                        const radius = progress * 150;
                        const opacity = 1 - progress;
                        
                        particle.style.left = `${x + Math.cos(angle) * radius}px`;
                        particle.style.top = `${y + Math.sin(angle) * radius}px`;
                        particle.style.opacity = opacity;
                        
                        if (progress < 1) {
                            requestAnimationFrame(animateParticle);
                        } else {
                            container.removeChild(particle);
                        }
                    }
                    
                    requestAnimationFrame(animateParticle);
                }
            }
            
            function createWave(x, y, color, count) {
                // Implementation for wave effect
                for (let i = 0; i < count; i++) {
                    const wave = document.createElement('div');
                    wave.style.position = 'absolute';
                    wave.style.left = `${x}px`;
                    wave.style.top = `${y}px`;
                    wave.style.width = '10px';
                    wave.style.height = '10px';
                    wave.style.borderRadius = '50%';
                    wave.style.background = 'transparent';
                    wave.style.border = `2px solid ${color}`;
                    wave.style.transform = 'translate(-50%, -50%)';
                    wave.style.opacity = '1';
                    container.appendChild(wave);
                    
                    setTimeout(() => {
                        wave.style.transition = `all 1.5s ease-out`;
                        wave.style.width = '300px';
                        wave.style.height = '300px';
                        wave.style.opacity = '0';
                        
                        setTimeout(() => {
                            container.removeChild(wave);
                        }, 1500);
                    }, i * 200);
                }
            }
            
            function createFadeEffect(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const particle = document.createElement('div');
                        particle.classList.add('trail');
                        particle.style.left = `${x + (Math.random() - 0.5) * 100}px`;
                        particle.style.top = `${y + (Math.random() - 0.5) * 100}px`;
                        particle.style.width = '15px';
                        particle.style.height = '15px';
                        particle.style.background = color;
                        particle.style.opacity = '0.8';
                        
                        container.appendChild(particle);
                        
                        setTimeout(() => {
                            container.removeChild(particle);
                        }, 1000);
                    }, i * 50);
                }
            }
            
            function createPulse(x, y, color, count) {
                // Creates a pulsing effect
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const pulse = document.createElement('div');
                        pulse.style.position = 'absolute';
                        pulse.style.left = `${x}px`;
                        pulse.style.top = `${y}px`;
                        pulse.style.width = '20px';
                        pulse.style.height = '20px';
                        pulse.style.borderRadius = '50%';
                        pulse.style.background = color;
                        pulse.style.transform = 'translate(-50%, -50%)';
                        pulse.style.opacity = '0.7';
                        container.appendChild(pulse);
                        
                        pulse.animate([
                            { transform: 'translate(-50%, -50%) scale(1)', opacity: 0.7 },
                            { transform: 'translate(-50%, -50%) scale(2)', opacity: 0 }
                        ], { 
                            duration: 1000,
                            easing: 'ease-out'
                        });
                        
                        setTimeout(() => {
                            container.removeChild(pulse);
                        }, 1000);
                    }, i * 100);
                }
            }
            
            function createOrbit(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const orbitPoint = document.createElement('div');
                    orbitPoint.style.position = 'absolute';
                    orbitPoint.style.width = '12px';
                    orbitPoint.style.height = '12px';
                    orbitPoint.style.borderRadius = '50%';
                    orbitPoint.style.background = color;
                    container.appendChild(orbitPoint);
                    
                    const angle = (i / count) * Math.PI * 2;
                    const radius = 80;
                    const duration = 2000;
                    const startTime = Date.now();
                    
                    function animateOrbit() {
                        const elapsed = Date.now() - startTime;
                        const progress = (elapsed % duration) / duration;
                        const currentAngle = angle + progress * Math.PI * 2;
                        
                        orbitPoint.style.left = `${x + Math.cos(currentAngle) * radius}px`;
                        orbitPoint.style.top = `${y + Math.sin(currentAngle) * radius}px`;
                        
                        if (elapsed < 3000) {
                            requestAnimationFrame(animateOrbit);
                        } else {
                            container.removeChild(orbitPoint);
                        }
                    }
                    
                    requestAnimationFrame(animateOrbit);
                }
            }
            
            function createRain(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const raindrop = document.createElement('div');
                        raindrop.classList.add('trail');
                        raindrop.style.left = `${x + (Math.random() - 0.5) * 200}px`;
                        raindrop.style.top = `${y - 100}px`;
                        raindrop.style.width = '5px';
                        raindrop.style.height = '15px';
                        raindrop.style.borderRadius = '5px';
                        raindrop.style.background = color;
                        container.appendChild(raindrop);
                        
                        raindrop.animate([
                            { transform: 'translateY(0)', opacity: 1 },
                            { transform: 'translateY(300px)', opacity: 0 }
                        ], {
                            duration: 1000 + Math.random() * 500,
                            easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)'
                        });
                        
                        setTimeout(() => {
                            container.removeChild(raindrop);
                        }, 1500);
                    }, i * 50);
                }
            }
            
            function createHyperEffect(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const particle = document.createElement('div');
                    particle.classList.add('trail');
                    
                    const size = 5 + Math.random() * 10;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.background = color;
                    container.appendChild(particle);
                    
                    const angle = Math.random() * Math.PI * 2;
                    const distance = 50 + Math.random() * 100;
                    const duration = 1500;
                    const startTime = Date.now();
                    
                    function animateHyper() {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(elapsed / duration, 1);
                        
                        // Hyperbolic curve
                        const factor = 1 / (1 - progress * 0.9);
                        const currentDistance = distance * factor;
                        
                        particle.style.left = `${x + Math.cos(angle) * currentDistance}px`;
                        particle.style.top = `${y + Math.sin(angle) * currentDistance}px`;
                        particle.style.opacity = 1 - progress;
                        
                        if (progress < 1) {
                            requestAnimationFrame(animateHyper);
                        } else {
                            container.removeChild(particle);
                        }
                    }
                    
                    requestAnimationFrame(animateHyper);
                }
            }
        });
    </script>
